  - name: 📜 Upstream issue audit
    url: https://github.com/gasanache/Nightcap/blob/main/docs/AUDIT.md
    about: Per-issue accounting of how this fork addresses the archived upstream's open issues.
  - name: 📦 Archived upstream (nightcap-app/nightcap)
    url: https://github.com/nightcap-app/nightcap
